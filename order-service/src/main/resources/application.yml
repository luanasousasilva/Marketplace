server: { port: 8083 }
spring:
  application: { name: order-service }
  datasource: { url: jdbc:postgresql://localhost:5432/marketplace, username: marketplace, password: marketplace }
  jpa: { hibernate: { ddl-auto: update }, properties: { hibernate.default_schema: orders } }
  data: { mongodb: { uri: mongodb://localhost:27017/marketplace_orders }, redis: { host: localhost, port: 6379 } }
  session: { store-type: redis }
clients:
  product-service: { url: ${PRODUCT_SERVICE_URL:http://localhost:8082} }
management:
  endpoints: { web: { exposure: { include: health,info,metrics,prometheus } } }
