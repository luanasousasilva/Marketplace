server: { port: 8084 }
spring:
  application: { name: payment-service }
  datasource: { url: jdbc:postgresql://localhost:5432/marketplace, username: marketplace, password: marketplace }
  jpa: { hibernate: { ddl-auto: update }, properties: { hibernate.default_schema: payments } }
  data: { mongodb: { uri: mongodb://localhost:27017/marketplace_payments }, redis: { host: localhost, port: 6379 } }
  session: { store-type: redis }
