server: { port: 8082 }
spring:
  application: { name: product-service }
  datasource: { url: jdbc:postgresql://localhost:5432/marketplace, username: marketplace, password: marketplace }
  jpa: { hibernate: { ddl-auto: update }, properties: { hibernate.default_schema: product } }
  data: { mongodb: { uri: mongodb://localhost:27017/marketplace_products }, redis: { host: localhost, port: 6379 } }
  session: { store-type: redis }
management:
  endpoints: { web: { exposure: { include: health,info,metrics,prometheus } } }
