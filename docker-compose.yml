services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: marketplace, POSTGRES_USER: marketplace, POSTGRES_PASSWORD: marketplace }
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql"]
  mongodb:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
  customer-service:
    build: { context: ., args: { SERVICE: customer-service } }
    environment: { SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marketplace, SPRING_DATA_REDIS_HOST: redis }
    ports: ["8081:8081"]
    depends_on: [postgres, redis]
  product-service:
    build: { context: ., args: { SERVICE: product-service } }
    environment: { SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marketplace, SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/marketplace_products, SPRING_DATA_REDIS_HOST: redis }
    ports: ["8082:8082"]
    depends_on: [postgres, mongodb, redis]
  order-service:
    build: { context: ., args: { SERVICE: order-service } }
    environment: { SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marketplace, SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/marketplace_orders, SPRING_DATA_REDIS_HOST: redis }
    ports: ["8083:8083"]
    depends_on: [postgres, mongodb, redis]
  payment-service:
    build: { context: ., args: { SERVICE: payment-service } }
    environment: { SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marketplace, SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/marketplace_payments, SPRING_DATA_REDIS_HOST: redis }
    ports: ["8084:8084"]
    depends_on: [postgres, mongodb, redis]
  notification-service:
    build: { context: ., args: { SERVICE: notification-service } }
    environment: { SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marketplace, SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/marketplace_notifications, SPRING_DATA_REDIS_HOST: redis }
    ports: ["8085:8085"]
    depends_on: [postgres, mongodb, redis]
volumes: { postgres_data: {}, mongo_data: {} }
